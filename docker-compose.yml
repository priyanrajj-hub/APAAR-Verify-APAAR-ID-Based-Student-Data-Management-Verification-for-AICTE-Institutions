services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - VERIFY_SVC_URL=http://verify-svc:8002
      - MATCH_SVC_URL=http://match-svc:8003
      - ANOMALY_SVC_URL=http://anomaly-svc:8004
      - RAG_SVC_URL=http://rag-svc:8005
      - AUDIT_SVC_URL=http://audit-svc:8006
    depends_on:
      - redis

  verify-svc:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
      args:
        SERVICE_NAME: verify
    ports:
      - "8002:8002"
    environment:
      - PORT=8002

  match-svc:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
      args:
        SERVICE_NAME: match
    ports:
      - "8003:8003"
    environment:
      - PORT=8003

  anomaly-svc:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
      args:
        SERVICE_NAME: anomaly
    ports:
      - "8004:8004"
    environment:
      - PORT=8004

  rag-svc:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
      args:
        SERVICE_NAME: rag
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

  audit-svc:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
      args:
        SERVICE_NAME: audit
    ports:
      - "8006:8006"
    environment:
      - PORT=8006

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  redis_data:
  qdrant_data:
