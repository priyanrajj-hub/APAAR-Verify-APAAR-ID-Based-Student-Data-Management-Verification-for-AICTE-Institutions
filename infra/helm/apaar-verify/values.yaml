replicaCount: 2

image:
  repository: ghcr.io/priyanrajj-hub/apaar-verify
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: apaar.aicte-india.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: apaar-tls-cert
      hosts:
        - apaar.aicte-india.org

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

env:
  NODE_ENV: "production"
  LLM_PROVIDER: "offline"
  REDIS_URL: "redis://redis-cluster:6379/0"
  QDRANT_URL: "http://qdrant:6333"
