apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apaar-ingress
  namespace: apaar-verify
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.apaar-verify.gov.in
      secretName: apaar-tls-cert
  rules:
    - host: api.apaar-verify.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
