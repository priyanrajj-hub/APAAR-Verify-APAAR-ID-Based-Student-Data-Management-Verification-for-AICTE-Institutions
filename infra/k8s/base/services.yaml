apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: apaar-verify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: apaar-verify/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: apaar-verify
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verify-svc
  namespace: apaar-verify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verify-svc
  template:
    metadata:
      labels:
        app: verify-svc
    spec:
      containers:
        - name: verify
          image: apaar-verify/verify-svc:latest
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: verify-svc
  namespace: apaar-verify
spec:
  selector:
    app: verify-svc
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-svc
  namespace: apaar-verify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-svc
  template:
    metadata:
      labels:
        app: rag-svc
    spec:
      containers:
        - name: rag
          image: apaar-verify/rag-svc:latest
          ports:
            - containerPort: 8005
          env:
            - name: PORT
              value: "8005"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-svc
  namespace: apaar-verify
spec:
  selector:
    app: rag-svc
  ports:
    - protocol: TCP
      port: 8005
      targetPort: 8005
