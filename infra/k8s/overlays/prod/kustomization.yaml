apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apaar-verify-prod

resources:
  - ../../base

namePrefix: prod-

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Deployment
      name: verify-svc
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
